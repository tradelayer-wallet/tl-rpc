[package]
name = "tl-rpc-client"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
description = "Read-only TradeLayer RPC client with bounded HTTPS transport"
publish = false

[dependencies]
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.54.1", features = ["rt", "time", "net"] }
